<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="fonts/poppins.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pin.css">
<script src="i18n.js"></script>
<script src="locales/de.js"></script>
<script src="locales/es.js"></script>
<script src="locales/fr.js"></script>
<script src="locales/ja.js"></script>
<script src="theme.js"></script>
</head>
<body>
<img id="image" alt="Pinned image" draggable="false" title="Drag to move · scroll or pinch to zoom · double-click or Esc to close">
<button type="button" class="pin-close" id="btn-close" aria-label="Close" title="Close (Esc)">✕</button>
<div class="pin-opacity" title="Opacity (⌘1–⌘9; ⌘0 for 100%)">
  <span aria-hidden="true">◐</span>
  <input type="range" id="opacity" min="10" max="100" step="5" value="100" aria-label="Opacity">
  <span id="opacity-value">100%</span>
</div>
<div class="pin-zoom" id="zoom" aria-live="polite"></div>
<script src="pin.js"></script>
</body>
</html>
