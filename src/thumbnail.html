<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="fonts/poppins.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="thumbnail.css">
<script src="i18n.js"></script>
<script src="locales/de.js"></script>
<script src="locales/es.js"></script>
<script src="locales/fr.js"></script>
<script src="locales/ja.js"></script>
<script src="theme.js"></script>
</head>
<body>
<div class="shot" id="shot" draggable="true" role="button" aria-label="Edit capture" title="Click to edit, or drag into another app">
  <img id="preview" alt="" draggable="false">
</div>
<div class="bar">
  <button type="button" id="btn-copy" title="Copy to the clipboard">Copy</button>
  <button type="button" id="btn-edit" title="Open in the editor">Edit</button>
  <button type="button" id="btn-pin" title="Pin to the screen">Pin</button>
  <button type="button" class="close" id="btn-close" aria-label="Close" title="Close">✕</button>
</div>
<script src="thumbnail.js"></script>
</body>
</html>
