<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src mediastream:; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="fonts/poppins.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  font-family: 'Poppins', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.hud {
  width: 100vw;
  height: 70px;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 3px;
  background: rgba(27, 19, 53, 0.97);
  border-radius: 18px;
  padding: 8px 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.07);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  -webkit-app-region: drag;
  cursor: -webkit-grab;
}
.hud.collapsed {
  justify-content: center;
  padding: 8px;
}
.hud.collapsed .mode-btn,
.hud.collapsed .audio-toggles,
.hud.collapsed .sep,
.hud.collapsed .hist-btn {
  display: none;
}
.hud.collapsed .collapse-btn {
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 20px;
  height: 20px;
  border-radius: 999px;
  font-size: 13px;
  background: rgba(108,78,246,.88);
  color: #fff;
}
.drag-handle {
  width: 52px;
  height: 52px;
  padding: 0;
  margin-right: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-app-region: drag;
}
.hud.collapsed .drag-handle {
  margin-right: 0;
}
.drag-handle img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  pointer-events: none;
  display: block;
}
.mode-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.05);
  cursor: pointer;
  min-width: 46px;
  transition: background .15s;
  -webkit-app-region: no-drag;
  font-family: inherit;
  color: inherit;
}
.mode-btn:disabled { cursor: default; }
.mode-btn:hover:not(:disabled) { background: rgba(108,78,246,.25); }
.mode-btn:disabled { opacity: 0.35; cursor: default; }
.mode-btn .ic { font-size: 17px; line-height: 1; color: rgba(255,255,255,.6); }
.mode-btn:hover:not(:disabled) .ic { color: #fff; }
.mode-btn .lbl { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.38); }
.mode-btn:hover:not(:disabled) .lbl { color: rgba(255,255,255,.9); }
.mode-btn.flash { background: #6C4EF6 !important; }
.mode-btn.flash .ic, .mode-btn.flash .lbl { color: #fff !important; }
.sep { width: 1px; height: 34px; background: rgba(255,255,255,.08); margin: 0 4px; flex-shrink: 0; }
.rec-bar {
  display: none;
  align-items: center;
  gap: 10px;
  -webkit-app-region: no-drag;
}
.rec-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #ef4444; flex-shrink: 0;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.rec-timer {
  font-size: 14px; font-weight: 600; color: #fff;
  font-variant-numeric: tabular-nums; min-width: 38px;
}
.rec-stop {
  padding: 6px 14px; border-radius: 12px; border: none;
  background: #ef4444; color: #fff; font: 600 12px inherit;
  cursor: pointer !important; -webkit-app-region: no-drag;
}
.rec-stop:hover { background: #dc2626; }
.audio-toggles { display: flex; flex-direction: column; gap: 3px; margin-left: -1px; -webkit-app-region: no-drag; }
.audio-toggle {
  width: 24px; height: 22px; border: none; border-radius: 7px; cursor: pointer;
  background: rgba(255,255,255,.05); font-size: 11px; line-height: 1; filter: grayscale(1); opacity: .45;
}
.audio-toggle:hover { opacity: .8; }
.audio-toggle.on { background: rgba(108,78,246,.45); filter: none; opacity: 1; }
.rec-audio { font-size: 12px; letter-spacing: 2px; }
.rec-note {
  border: none; background: rgba(245,158,11,.18); color: #fbbf24; font: 600 11px inherit;
  padding: 4px 8px; border-radius: 8px; cursor: pointer; -webkit-app-region: no-drag; white-space: nowrap;
}
.rec-bar.scroll .rec-dot { background: #6c4ef6; }
.rec-bar.scroll .rec-stop { background: #6c4ef6; }
.rec-bar.scroll .rec-stop:hover { background: #5a3de0; }
.rec-bar.busy .rec-dot { animation: none; opacity: .4; }
.rec-bar.busy .rec-stop { opacity: .5; pointer-events: none; }
.hist-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  border-radius: 12px;
  border: none;
  background: transparent;
  cursor: pointer !important;
  -webkit-app-region: no-drag;
  font-family: inherit;
}
.hist-btn .ic { font-size: 15px; color: rgba(255,255,255,.3); }
.hist-btn .lbl { font-size: 10px; color: rgba(255,255,255,.22); }
.hist-btn:hover .ic { color: rgba(255,255,255,.6); }
.hist-btn:hover .lbl { color: rgba(255,255,255,.5); }
.collapse-btn {
  width: 28px;
  height: 42px;
  border: 0;
  border-radius: 10px;
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.42);
  cursor: pointer;
  font: 700 16px system-ui;
  -webkit-app-region: no-drag;
}
.collapse-btn:hover { background: rgba(108,78,246,.22); color: #fff; }
</style>
</head>
<body>
<div class="hud">
  <div class="drag-handle">
    <img src="../picker-hud.png" alt="Jack's Picker">
  </div>
  <button class="collapse-btn" id="btn-collapse" title="Collapse HUD">‹</button>

  <button class="mode-btn" data-mode="region" title="Capture Region">
    <span class="ic">⊹</span><span class="lbl">Region</span>
  </button>
  <button class="mode-btn" data-mode="window" title="Capture Window">
    <span class="ic">⬚</span><span class="lbl">Window</span>
  </button>
  <button class="mode-btn" data-mode="full" title="Full Screen">
    <span class="ic">⛶</span><span class="lbl">Full</span>
  </button>
  <button class="mode-btn" data-mode="scroll" title="Scrolling capture">
    <span class="ic">↕</span><span class="lbl">Scroll</span>
  </button>
  <button class="mode-btn" data-mode="record" title="Record screen">
    <span class="ic">⏺</span><span class="lbl">Record</span>
  </button>
  <div class="audio-toggles">
    <button class="audio-toggle" data-audio="system" type="button" title="Record system audio (sound your Mac plays)">🔊</button>
    <button class="audio-toggle" data-audio="mic" type="button" title="Record microphone">🎙</button>
  </div>
  <button class="mode-btn" data-mode="gif" title="Record GIF">
    <span class="ic">◑</span><span class="lbl">GIF</span>
  </button>

  <div class="sep"></div>

  <button class="hist-btn" title="Capture history">
    <span class="ic">▤</span><span class="lbl">History</span>
  </button>

  <div class="rec-bar" id="rec-bar">
    <span class="rec-dot"></span>
    <span class="rec-timer" id="rec-timer">0:00</span>
    <span class="rec-audio" id="rec-audio"></span>
    <button class="rec-note" id="rec-note" type="button" hidden></button>
    <button class="rec-stop" id="btn-stop-rec">■ Stop</button>
  </div>
</div>

<script src="scroll-stitch.js"></script>
<script src="vendor/gifenc.js"></script>
<script>
const hud = document.querySelector('.hud');
const dragHandle = document.querySelector('.drag-handle');
const collapseBtn = document.getElementById('btn-collapse');
let collapsed = localStorage.getItem('jqg-hud-collapsed') === '1';

function setCollapsed(next) {
  collapsed = !!next;
  hud.classList.toggle('collapsed', collapsed);
  collapseBtn.title = collapsed ? 'Expand HUD' : 'Collapse HUD';
  collapseBtn.textContent = collapsed ? '›' : '‹';
  localStorage.setItem('jqg-hud-collapsed', collapsed ? '1' : '0');
  window.electronAPI?.hudSetCollapsed?.(collapsed);
}

collapseBtn.addEventListener('click', () => setCollapsed(!collapsed));
dragHandle.addEventListener('dblclick', () => setCollapsed(!collapsed));
setCollapsed(collapsed);

// ── Capture buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn:not(:disabled)').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 600);
    if (window.electronAPI) window.electronAPI.hudCapture(btn.dataset.mode);
  });
});

// ── Shortcut tooltips (user-configurable, so read from main) ──────────────────
const IS_MAC = /Mac/i.test(navigator.platform || navigator.userAgent);
const SHORTCUT_TIPS = { region: 'Capture Region', window: 'Capture Window', full: 'Full Screen' };
const MOD_ORDER = ['ctrl', 'alt', 'shift', 'cmd'];
const MOD_LABELS = IS_MAC
  ? { ctrl: '⌃', alt: '⌥', shift: '⇧', cmd: '⌘' }
  : { ctrl: 'Ctrl', alt: 'Alt', shift: 'Shift', cmd: 'Super' };

function modFromPart(part) {
  if (/^(CommandOrControl|CmdOrCtrl)$/i.test(part)) return IS_MAC ? 'cmd' : 'ctrl';
  if (/^(Command|Cmd|Meta|Super)$/i.test(part)) return 'cmd';
  if (/^(Control|Ctrl)$/i.test(part)) return 'ctrl';
  if (/^(Alt|Option|AltGr)$/i.test(part)) return 'alt';
  if (/^Shift$/i.test(part)) return 'shift';
  return '';
}

function displayHotkey(accelerator) {
  const parts = String(accelerator || '').split('+').filter(Boolean);
  const key = parts.pop();
  if (!key) return '';
  const mods = new Set(parts.map(modFromPart));
  const labels = MOD_ORDER.filter(m => mods.has(m)).map(m => MOD_LABELS[m]);
  const keyLabel = key === 'Plus' ? '+' : key;
  return IS_MAC ? labels.join('') + keyLabel : [...labels, keyLabel].join('+');
}

async function refreshShortcutTips() {
  let shortcuts = {};
  try { shortcuts = (await window.electronAPI?.shortcutsGet?.())?.shortcuts || {}; } catch {}
  Object.entries(SHORTCUT_TIPS).forEach(([mode, label]) => {
    const btn = document.querySelector(`.mode-btn[data-mode="${mode}"]`);
    const combo = displayHotkey(shortcuts[mode]);
    if (btn) btn.title = combo ? `${label} (${combo})` : label;
  });
}

refreshShortcutTips();
// Shortcuts can be changed from the editor while the HUD stays open; refresh before tooltips show.
hud.addEventListener('mouseenter', refreshShortcutTips);

// ── History ───────────────────────────────────────────────────────────────────
document.querySelector('.hist-btn').addEventListener('click', () => {
  if (window.electronAPI) window.electronAPI.hudHistory();
});

// ── Streamed captures: screen recording, GIF, scrolling capture ───────────────
// Main opens the region overlay, then sends the chosen rect here. All three modes
// read the same display stream cropped to that rect; they differ in what they do
// with the frames.
const GIF_FPS = 12, GIF_MAX_WIDTH = 800, GIF_MAX_SECS = 30;
const SCROLL_FPS = 8, SCROLL_MAX_LENGTH = 20000;

const recBar   = document.getElementById('rec-bar');
const recTimer = document.getElementById('rec-timer');
const stopBtn  = document.getElementById('btn-stop-rec');
let session = null;   // { kind, finish(), ... } while a streamed capture is running

function setRecordingUI(kind) {
  recBar.style.display = kind ? 'flex' : 'none';
  recBar.classList.toggle('scroll', kind === 'scroll');
  recBar.classList.remove('busy');
  stopBtn.textContent = kind === 'scroll' ? '✓ Done' : '■ Stop';
  document.querySelectorAll('.mode-btn, .audio-toggles, .sep, .hist-btn')
    .forEach(el => el.style.display = kind ? 'none' : '');
  if (!kind) showRecNote(null);
}

function setStatus(text) { recTimer.textContent = text; }

function startTimer() {
  const t0 = Date.now();
  const tick = () => {
    const secs = Math.floor((Date.now() - t0) / 1000);
    setStatus(`${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`);
  };
  tick();
  return setInterval(tick, 1000);
}

// Opens the display stream and returns a function that draws the region into a canvas.
async function openRegionStream({ x, y, w, h, displayW, displayH }, { systemAudio = false } = {}) {
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: systemAudio });
  } catch (err) {
    if (!systemAudio) throw err;
    // System audio capture needs macOS 13+; record the screen without it rather than failing.
    console.warn('system audio unavailable', err);
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    showRecNote('No system audio', 'System audio needs macOS 13 or later');
  }
  const video = document.createElement('video');
  video.srcObject = stream;
  video.muted = true;
  await new Promise(resolve => { video.onloadedmetadata = resolve; });
  await video.play();
  // Logical rect → video pixels (the stream is usually at the display's native resolution).
  const sx = video.videoWidth / displayW, sy = video.videoHeight / displayH;
  const crop = { x: Math.round(x * sx), y: Math.round(y * sy), w: Math.round(w * sx), h: Math.round(h * sy) };
  const drawTo = (ctx, outW = crop.w, outH = crop.h) =>
    ctx.drawImage(video, crop.x, crop.y, crop.w, crop.h, 0, 0, outW, outH);
  const close = () => stream.getTracks().forEach(t => t.stop());
  return { crop, drawTo, close, audioTracks: stream.getAudioTracks() };
}

function startVideo(src, { mic = null } = {}) {
  const canvas = document.createElement('canvas');
  canvas.width = src.crop.w; canvas.height = src.crop.h;
  const ctx = canvas.getContext('2d');
  let drawing = true;
  (function draw() {
    if (!drawing) return;
    src.drawTo(ctx);
    requestAnimationFrame(draw);
  })();

  // System audio and mic are mixed into one track (MediaRecorder records a single audio track).
  const audioSources = [...src.audioTracks, ...(mic ? mic.getAudioTracks() : [])];
  let audioCtx = null;
  const tracks = canvas.captureStream(30).getVideoTracks();
  if (audioSources.length) {
    audioCtx = new AudioContext();
    const mix = audioCtx.createMediaStreamDestination();
    audioSources.forEach(t => audioCtx.createMediaStreamSource(new MediaStream([t])).connect(mix));
    tracks.push(...mix.stream.getAudioTracks());
  }
  const withAudio = tracks.length > 1;
  const mimeType = [withAudio ? 'video/mp4;codecs=avc1,mp4a.40.2' : 'video/mp4', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t));
  const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
  const recorder = new MediaRecorder(new MediaStream(tracks), { mimeType });
  document.getElementById('rec-audio').textContent =
    `${src.audioTracks.length ? '🔊' : ''}${mic ? '🎙' : ''}`;
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const saved = new Promise(resolve => {
    recorder.onstop = async () => {
      drawing = false;
      src.close();
      mic?.getTracks().forEach(t => t.stop());
      audioCtx?.close();
      const buffer = await new Blob(chunks, { type: mimeType }).arrayBuffer();
      await window.electronAPI.saveRecording(buffer, ext);
      resolve();
    };
  });
  recorder.start(1000);
  const timer = startTimer();
  return {
    async finish() {
      clearInterval(timer);
      if (recorder.state !== 'inactive') recorder.stop();
      window.electronAPI.recordingStopped();
      await saved;
    },
  };
}

// GIF frames are palette-quantized and encoded as they arrive, so memory stays at
// the size of the compressed GIF rather than every raw frame.
function startGif(src) {
  const { GIFEncoder, quantize, applyPalette } = window.gifenc;
  const scale = Math.min(1, GIF_MAX_WIDTH / src.crop.w);
  const gw = Math.max(1, Math.round(src.crop.w * scale)), gh = Math.max(1, Math.round(src.crop.h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = gw; canvas.height = gh;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const encoder = GIFEncoder();
  const delay = Math.round(1000 / GIF_FPS);
  let frames = 0;

  const grab = () => {
    src.drawTo(ctx, gw, gh);
    const { data } = ctx.getImageData(0, 0, gw, gh);
    const palette = quantize(data, 256);
    encoder.writeFrame(applyPalette(data, palette), gw, gh, { palette, delay });
    if (++frames >= GIF_MAX_SECS * GIF_FPS) stopSession();
  };
  const interval = setInterval(grab, delay);
  const timer = startTimer();
  return {
    async finish() {
      clearInterval(interval);
      clearInterval(timer);
      src.close();
      window.electronAPI.recordingStopped();
      if (!frames) return;
      encoder.finish();
      const bytes = encoder.bytes();
      await window.electronAPI.saveRecording(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength), 'gif');
    },
  };
}

// The user scrolls the page under the (click-through) overlay; each frame is matched
// against the last one and only the newly revealed rows (or columns) are appended.
// Direction isn't chosen up front: a stitcher per direction sees frames until one detects
// movement, then capture locks to that direction.
function startScroll(src) {
  const ARROWS = { down: '↓', up: '↑', right: '→', left: '←' };
  const candidates = Object.keys(ARROWS)
    .map(direction => new window.DirectionalScrollStitcher(direction, { maxLength: SCROLL_MAX_LENGTH }));
  let stitcher = null;
  const canvas = document.createElement('canvas');
  canvas.width = src.crop.w; canvas.height = src.crop.h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const lengthLabel = px => `${Math.round(px / window.devicePixelRatio).toLocaleString()} px`;

  const grab = () => {
    src.drawTo(ctx);
    const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
    if (!stitcher) {
      const moved = candidates.find(c => c.addFrame(frame).status === 'appended');
      if (!moved) { setStatus('Scroll any way'); return; }
      stitcher = moved;
    } else {
      const result = stitcher.addFrame(frame);
      if (result.status === 'lost') { setStatus('Scroll slower'); return; }
      if (result.status === 'full') { setStatus('Max length'); stopSession(); return; }
    }
    setStatus(`${ARROWS[stitcher.direction]} ${lengthLabel(stitcher.length)}`);
  };
  const interval = setInterval(grab, Math.round(1000 / SCROLL_FPS));
  grab();
  return {
    async finish() {
      clearInterval(interval);
      src.close();
      // Never scrolled: the single captured frame is still a valid screenshot.
      const done = stitcher || candidates[0];
      if (!done.length) { window.electronAPI.scrollCaptureDone(null); return; }
      const { width, height, data } = done.result();
      const out = document.createElement('canvas');
      out.width = width; out.height = height;
      out.getContext('2d').putImageData(new ImageData(data, width, height), 0, 0);
      window.electronAPI.scrollCaptureDone(out.toDataURL('image/png'));
    },
  };
}

async function stopSession() {
  if (!session) return;
  const current = session;
  session = null;
  recBar.classList.add('busy');
  setStatus(current.kind === 'video' ? 'Saving…' : current.kind === 'gif' ? 'Encoding…' : 'Stitching…');
  try { await current.finish(); }
  catch (err) { console.error(`${current.kind} capture failed:`, err); }
  setRecordingUI(null);
}

// ── Recording audio: 🔊 system audio and 🎙 microphone toggles (remembered) ──
const REC_AUDIO_KEY = 'jqg-rec-audio';
let recAudioPrefs = { system: false, mic: false };
try { recAudioPrefs = { ...recAudioPrefs, ...JSON.parse(localStorage.getItem(REC_AUDIO_KEY) || '{}') }; } catch {}

function syncAudioToggles() {
  document.querySelectorAll('.audio-toggle').forEach(b => {
    const on = !!recAudioPrefs[b.dataset.audio];
    b.classList.toggle('on', on);
    const what = b.dataset.audio === 'mic' ? 'microphone' : 'system audio (sound your Mac plays)';
    b.title = `${on ? 'Recording' : 'Not recording'} ${what}: click to turn ${on ? 'off' : 'on'}`;
  });
}

document.querySelectorAll('.audio-toggle').forEach(b => b.addEventListener('click', async () => {
  const key = b.dataset.audio;
  recAudioPrefs[key] = !recAudioPrefs[key];
  // Ask for the mic when it's switched on, so the prompt doesn't interrupt a recording.
  if (key === 'mic' && recAudioPrefs.mic && window.electronAPI && !(await window.electronAPI.micAccess())) {
    recAudioPrefs.mic = false;
    b.title = 'Microphone access is off: allow Jack\'s Picker in System Settings → Privacy & Security → Microphone';
    window.electronAPI.openMicSettings();
  }
  localStorage.setItem(REC_AUDIO_KEY, JSON.stringify(recAudioPrefs));
  syncAudioToggles();
}));
syncAudioToggles();

async function openMicStream() {
  try {
    if (!(await window.electronAPI.micAccess())) { showRecNote('Mic blocked', 'Allow the microphone in System Settings', true); return null; }
    return await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    console.warn('microphone unavailable', err);
    showRecNote('No microphone', 'No microphone could be opened');
    return null;
  }
}

// A short warning in the recording bar (e.g. audio that couldn't be captured). Clicking a
// permission note opens the relevant settings.
let recNoteTimer = null;
function showRecNote(text, title = '', openSettings = false) {
  const note = document.getElementById('rec-note');
  clearTimeout(recNoteTimer);
  note.hidden = !text;
  if (!text) return;
  note.textContent = `⚠ ${text}`;
  note.title = title;
  note.onclick = openSettings ? () => window.electronAPI.openMicSettings() : null;
  recNoteTimer = setTimeout(() => { note.hidden = true; }, 6000);
}

if (window.electronAPI) {
  window.electronAPI.onRecordingRegion(async region => {
    const kind = region.kind || 'video';
    try {
      // Audio applies to screen recordings only (not GIF or scrolling capture).
      const audio = kind === 'video' ? recAudioPrefs : { system: false, mic: false };
      const mic = audio.mic ? await openMicStream() : null;
      const src = await openRegionStream(region, { systemAudio: audio.system });
      const start = { video: startVideo, gif: startGif, scroll: startScroll }[kind];
      setRecordingUI(kind);
      session = { kind, ...start(src, { mic }) };
    } catch (err) {
      console.error(`${kind} capture failed:`, err);
      setRecordingUI(null);
      if (kind === 'scroll') window.electronAPI.scrollCaptureDone(null);
      else window.electronAPI.recordingStopped();
    }
  });
}

stopBtn.addEventListener('click', stopSession);
</script>
</body>
</html>
