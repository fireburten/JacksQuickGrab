<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: transparent;
  font-family: 'Poppins', system-ui, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.hud {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 3px;
  background: rgba(27, 19, 53, 0.97);
  border-radius: 18px;
  padding: 8px 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  -webkit-app-region: drag;
  cursor: -webkit-grab;
}
.drag-handle {
  padding: 0 8px 0 2px;
  border-right: 1px solid rgba(255,255,255,.09);
  margin-right: 4px;
  display: flex;
  align-items: center;
}
.drag-handle img {
  width: 34px;
  height: 34px;
  object-fit: contain;
  pointer-events: none;
  display: block;
  background: #fff;
  border-radius: 7px;
  padding: 2px;
}
.mode-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 10px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.05);
  cursor: pointer;
  min-width: 46px;
  transition: background .15s;
  -webkit-app-region: no-drag;
  font-family: inherit;
  color: inherit;
}
.mode-btn:disabled { cursor: default; }
.mode-btn:hover:not(:disabled) { background: rgba(108,78,246,.25); }
.mode-btn:disabled { opacity: 0.35; cursor: default; }
.mode-btn .ic { font-size: 17px; line-height: 1; color: rgba(255,255,255,.6); }
.mode-btn:hover:not(:disabled) .ic { color: #fff; }
.mode-btn .lbl { font-size: 10px; font-weight: 500; color: rgba(255,255,255,.38); }
.mode-btn:hover:not(:disabled) .lbl { color: rgba(255,255,255,.9); }
.mode-btn.flash { background: #6C4EF6 !important; }
.mode-btn.flash .ic, .mode-btn.flash .lbl { color: #fff !important; }
.sep { width: 1px; height: 34px; background: rgba(255,255,255,.08); margin: 0 4px; flex-shrink: 0; }
.rec-bar {
  display: none;
  align-items: center;
  gap: 10px;
  -webkit-app-region: no-drag;
}
.rec-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #ef4444; flex-shrink: 0;
  animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
.rec-timer {
  font-size: 14px; font-weight: 600; color: #fff;
  font-variant-numeric: tabular-nums; min-width: 38px;
}
.rec-stop {
  padding: 6px 14px; border-radius: 12px; border: none;
  background: #ef4444; color: #fff; font: 600 12px inherit;
  cursor: pointer !important; -webkit-app-region: no-drag;
}
.rec-stop:hover { background: #dc2626; }
.hist-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  border-radius: 12px;
  border: none;
  background: transparent;
  cursor: pointer !important;
  -webkit-app-region: no-drag;
  font-family: inherit;
}
.hist-btn .ic { font-size: 15px; color: rgba(255,255,255,.3); }
.hist-btn .lbl { font-size: 10px; color: rgba(255,255,255,.22); }
.hist-btn:hover .ic { color: rgba(255,255,255,.6); }
.hist-btn:hover .lbl { color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div class="hud">
  <div class="drag-handle">
    <img src="../logo.png" alt="JQG">
  </div>

  <button class="mode-btn" data-mode="region" title="Capture Region (⌘⇧4)">
    <span class="ic">⊹</span><span class="lbl">Region</span>
  </button>
  <button class="mode-btn" data-mode="window" title="Capture Window (⌘⇧W)">
    <span class="ic">⬚</span><span class="lbl">Window</span>
  </button>
  <button class="mode-btn" data-mode="full" title="Full Screen (⌘⇧3)">
    <span class="ic">⛶</span><span class="lbl">Full</span>
  </button>
  <button class="mode-btn" data-mode="scroll" title="Scrolling capture (coming soon)" disabled>
    <span class="ic">↕</span><span class="lbl">Scroll</span>
  </button>
  <button class="mode-btn" data-mode="record" title="Record screen">
    <span class="ic">⏺</span><span class="lbl">Record</span>
  </button>
  <button class="mode-btn" data-mode="gif" title="Record GIF (coming soon)" disabled>
    <span class="ic">◑</span><span class="lbl">GIF</span>
  </button>

  <div class="sep"></div>

  <button class="hist-btn" title="Capture history">
    <span class="ic">▤</span><span class="lbl">History</span>
  </button>

  <div class="rec-bar" id="rec-bar">
    <span class="rec-dot"></span>
    <span class="rec-timer" id="rec-timer">0:00</span>
    <button class="rec-stop" id="btn-stop-rec">■ Stop</button>
  </div>
</div>

<script>
// ── Capture buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn:not(:disabled):not([data-mode="record"])').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 600);
    if (window.electronAPI) window.electronAPI.hudCapture(btn.dataset.mode);
  });
});

// ── History ───────────────────────────────────────────────────────────────────
document.querySelector('.hist-btn').addEventListener('click', () => {
  if (window.electronAPI) window.electronAPI.hudHistory();
});

// ── Screen recording ──────────────────────────────────────────────────────────
let mediaRecorder = null;
let recChunks     = [];
let recInterval   = null;
let recSecs       = 0;
let recDrawing    = false;

const recBar   = document.getElementById('rec-bar');
const recTimer = document.getElementById('rec-timer');

function setRecordingUI(on) {
  recBar.style.display = on ? 'flex' : 'none';
  document.querySelectorAll('.mode-btn, .sep, .hist-btn')
    .forEach(el => el.style.display = on ? 'none' : '');
}

function tickTimer() {
  recSecs++;
  const m = Math.floor(recSecs / 60), s = recSecs % 60;
  recTimer.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// Record button → open region overlay in main
document.querySelector('[data-mode="record"]').addEventListener('click', () => {
  if (window.electronAPI) window.electronAPI.hudCapture('record');
});

// Main sends back the selected rect after user draws on the overlay
if (window.electronAPI) {
  window.electronAPI.onRecordingRegion(async ({ x, y, w, h, displayW, displayH }) => {
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });

      const video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      await new Promise(resolve => { video.onloadedmetadata = resolve; });
      await video.play();

      // Map logical rect coords → video pixel coords
      const sx = video.videoWidth  / displayW;
      const sy = video.videoHeight / displayH;
      const cropX = Math.round(x * sx), cropY = Math.round(y * sy);
      const cropW = Math.round(w * sx), cropH = Math.round(h * sy);

      const canvas = document.createElement('canvas');
      canvas.width = cropW; canvas.height = cropH;
      const ctx = canvas.getContext('2d');

      recDrawing = true;
      (function draw() {
        if (!recDrawing) return;
        ctx.drawImage(video, -cropX, -cropY, video.videoWidth, video.videoHeight);
        requestAnimationFrame(draw);
      })();

      const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      const ext      = mimeType === 'video/mp4' ? 'mp4' : 'webm';
      mediaRecorder  = new MediaRecorder(canvas.captureStream(30), { mimeType });
      recChunks = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        recDrawing = false;
        stream.getTracks().forEach(t => t.stop());
        const blob   = new Blob(recChunks, { type: mimeType });
        const buffer = await blob.arrayBuffer();
        await window.electronAPI.saveRecording(buffer, ext);
      };

      mediaRecorder.start(1000);
      recSecs = 0; recTimer.textContent = '0:00';
      recInterval = setInterval(tickTimer, 1000);
      setRecordingUI(true);
    } catch (err) {
      console.error('Recording failed:', err);
    }
  });
}

document.getElementById('btn-stop-rec').addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  clearInterval(recInterval);
  setRecordingUI(false);
  if (window.electronAPI) window.electronAPI.recordingStopped();
});
</script>
</body>
</html>
